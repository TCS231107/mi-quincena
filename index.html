<script>
(() => {
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) && n > 0 ? Math.round(n*100)/100 : 0; };
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmtD = d => `${d.getDate()} ${MESES[d.getMonth()]}`;
let fmtMoney = n => n.toFixed(0);
function setCurrency(cur){
  const f = new Intl.NumberFormat("es-CR", {style:"currency", currency:cur, maximumFractionDigits: cur==="CRC"?0:2});
  fmtMoney = n => f.format(n);
}

const FREQ = {
  quincenal:{label:"Quincenal", unit:"quincena", per:"por quincena", hint:"Cada 15 días (1–15 y 16–fin de mes)"},
  semanal:{label:"Semanal", unit:"semana", per:"por semana", hint:"Cada lunes a domingo"},
  mensual:{label:"Mensual", unit:"mes", per:"por mes", hint:"Una vez al mes"},
  diario:{label:"Por día", unit:"día", per:"por día", hint:"Te pagan cada día trabajado"}
};
const CURRENCIES = [
  ["CRC","₡","Colón costarricense"], ["USD","$","Dólar estadounidense"], ["EUR","€","Euro"],
  ["MXN","$","Peso mexicano"], ["COP","$","Peso colombiano"], ["GTQ","Q","Quetzal"],
  ["HNL","L","Lempira"], ["NIO","C$","Córdoba"], ["PAB","B/.","Balboa"], ["GBP","£","Libra esterlina"]
];
const curOptions = () => CURRENCIES.map(([c, s, n]) => `<option value="${c}">${s} ${n} (${c})</option>`).join("");
const SLOTS = {
  quincenal:[["all","Ambas quincenas"],["1","1ª quincena (1–15)"],["2","2ª quincena (16–fin)"]],
  semanal:[["all","Todas las semanas"],["1","Semana 1"],["2","Semana 2"],["3","Semana 3"],["4","Semana 4"]],
  mensual:[["all","Cada mes"]],
  diario:[["all","Todos los días"]]
};
const CATS = {
  comida:["Comida","#D4553A"], transporte:["Transporte","#3567C9"], servicios:["Servicios","#8457BF"],
  salud:["Salud","#0E8A73"], compras:["Compras","#D99A2B"], ocio:["Entretenimiento","#C2417F"], otros:["Otros","#6B7C78"]
};

/* ---------- periodos ---------- */
function periodOf(freq, date){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const y = d.getFullYear(), m = d.getMonth();
  if (freq === "mensual"){
    const start = new Date(y, m, 1), end = new Date(y, m+1, 0);
    return {key:`${y}-${pad(m+1)}`, start, end, slot:"all", label:`${MESES[m]} ${y}`};
  }
  if (freq === "quincenal"){
    const first = d.getDate() <= 15;
    const start = new Date(y, m, first ? 1 : 16), end = first ? new Date(y, m, 15) : new Date(y, m+1, 0);
    return {key:`${y}-${pad(m+1)}-Q${first?1:2}`, start, end, slot:first?"1":"2", label:`${first?"1ª":"2ª"} quincena de ${MESES[m]}`};
  }
  if (freq === "semanal"){
    const dow = (d.getDay() + 6) % 7; // lunes = 0
    const start = new Date(y, m, d.getDate() - dow), end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
    const w = Math.ceil(end.getDate() / 7);
    return {key:`W${iso(start)}`, start, end, slot: w <= 4 ? String(w) : "5", label:`Semana del ${fmtD(start)}`};
  }
  return {key:`D${iso(d)}`, start:d, end:d, slot:"all", label:`Hoy, ${fmtD(d)}`};
}
const nextDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
const daysBetween = (a, b) => Math.round((b - a) / 864e5);

/* ---------- estado ---------- */
let S = null;        // estado completo
let unlocked = false;
let view = "inicio";
let persist = null;  // {save(state)}
let downloadsApi = null;

function blankState(){
  return {v:1, account:null, name:"", theme:"system", freq:null, income:0, currency:"CRC", savingAmount:0, savingTotal:0,
    goals:[], fixed:[], expenses:[], applied:null, lastPeriodStart:null, history:[]};
}

/* Foto del periodo vigente, para el estado de cuenta */
function snapshotCurrent(){
  if (!S.applied || !S.lastPeriodStart || !S.freq) return null;
  const p = periodOf(S.freq, parseISO(S.lastPeriodStart));
  const goalName = id => (S.goals.find(g => g.id === id) || {}).name || (S.applied.names && S.applied.names[id]) || "Meta";
  return {
    key:p.key, label:p.label, start:iso(p.start), end:iso(p.end), freq:S.freq, currency:S.currency,
    income:S.income, saving:S.applied.saving || 0,
    goals:Object.entries(S.applied.goals || {}).filter(([, a]) => a > 0).map(([id, a]) => ({name:goalName(id), amount:a})),
    fixed:S.fixed.filter(f => f.slot === "all" || f.slot === p.slot).map(f => ({name:f.name, amount:f.amount}))
  };
}

function applyPeriod(p){
  const prev = snapshotCurrent();
  if (prev){
    S.history = (S.history || []).filter(h => h.key !== prev.key);
    S.history.push(prev);
    if (S.history.length > 72) S.history = S.history.slice(-72);
  }
  const saving = S.savingAmount;
  S.savingTotal += saving;
  const goals = {};
  for (const g of S.goals){
    const amt = Math.max(0, Math.min(g.per, g.target - g.saved));
    g.saved += amt; goals[g.id] = amt;
  }
  const names = {}; S.goals.forEach(g => names[g.id] = g.name);
  S.applied = {key:p.key, saving, goals, names};
  S.lastPeriodStart = iso(p.start);
}
function catchUp(){
  if (!S.freq) return false;
  const cur = periodOf(S.freq, new Date());
  if (S.applied && S.applied.key === cur.key) return false;
  if (!S.applied || !S.lastPeriodStart){ applyPeriod(cur); return true; }
  let p = periodOf(S.freq, parseISO(S.lastPeriodStart));
  for (let i = 0; i < 800; i++){
    p = periodOf(S.freq, nextDay(p.end));
    applyPeriod(p);
    if (p.key === cur.key || p.start > cur.start) break;
  }
  return true;
}

/* ---------- archivo de periodos anteriores ---------- */
const archiveCache = {};
const expensesIn = (a, b) => S.expenses.filter(e => e.date >= a && e.date <= b);
function periodTotals(h, exps){
  const goals = (h.goals || []).reduce((s, g) => s + g.amount, 0), fixed = (h.fixed || []).reduce((s, f) => s + f.amount, 0);
  const spent = exps.reduce((s, e) => s + e.amount, 0);
  return {spent, final: h.income - (h.saving || 0) - goals - fixed - spent};
}
let archiving = false;
async function flushArchives(){
  if (archiving || !persist || !persist.saveArchive) return;
  const pending = (S.history || []).filter(h => !h.archived);
  if (!pending.length) return;
  archiving = true;
  for (const h of pending){
    const exps = expensesIn(h.start, h.end);
    const full = Object.assign({}, h, {expenses: exps}); delete full.archived;
    try { await persist.saveArchive(h.key, full); } catch(e){ break; }
    Object.assign(h, periodTotals(h, exps), {archived: true, count: exps.length});
    archiveCache[h.key] = full;
    const ids = new Set(exps.map(e => e.id));
    S.expenses = S.expenses.filter(e => !ids.has(e.id));
  }
  archiving = false;
  save(); render();
}
async function ensureArchive(key){
  if (archiveCache[key] || !persist || !persist.loadArchive) return;
  archiveCache[key] = "loading";
  try { archiveCache[key] = (await persist.loadArchive(key)) || "missing"; } catch(e){ archiveCache[key] = "missing"; }
  render();
}
/* Periodo con sus gastos; null mientras carga */
function periodData(key){
  const cur = snapshotCurrent();
  const live = () => Object.assign({}, cur, {expenses: expensesIn(cur.start, cur.end), current: true});
  if (cur && (!key || key === cur.key)) return live();
  const h = (S.history || []).find(x => x.key === key);
  if (!h) return cur ? live() : null;
  if (!h.archived) return Object.assign({}, h, {expenses: expensesIn(h.start, h.end)});
  const a = archiveCache[key];
  if (!a){ ensureArchive(key); return null; }
  if (a === "loading") return null;
  if (a === "missing") return Object.assign({}, h, {expenses: [], missing: true});
  return a;
}
function undoApplied(){
  if (!S.applied) return;
  S.savingTotal = Math.max(0, S.savingTotal - S.applied.saving);
  for (const g of S.goals){ const a = S.applied.goals[g.id] || 0; g.saved = Math.max(0, g.saved - a); }
  S.applied = null; S.lastPeriodStart = null;
}

function budget(){
  const p = periodOf(S.freq, new Date());
  const a = S.applied || {saving:0, goals:{}};
  const saving = a.saving || 0;
  const goals = Object.values(a.goals || {}).reduce((s, x) => s + x, 0);
  const fixedItems = S.fixed.filter(f => f.slot === "all" || f.slot === p.slot);
  const fixed = fixedItems.reduce((s, f) => s + f.amount, 0);
  const s0 = iso(p.start), s1 = iso(p.end);
  const exps = S.expenses.filter(e => e.date >= s0 && e.date <= s1).sort((x, y) => y.date.localeCompare(x.date) || y.t - x.t);
  const spent = exps.reduce((s, e) => s + e.amount, 0);
  const free = S.income - saving - goals - fixed - spent;
  const today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.max(1, daysBetween(today, p.end) + 1);
  return {p, saving, goals, fixed, fixedItems, spent, exps, free, daysLeft};
}

async function hashPw(pw, salt){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pw));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2400);
}

/* rueda */
function wheel(b){
  const R = 82, C = 2 * Math.PI * R, total = S.income || 1;
  const over = b.free < 0;
  const segs = over
    ? [["var(--c-spend)", 1]]
    : [["var(--c-save)", b.saving], ["var(--c-goal)", b.goals], ["var(--c-fixed)", b.fixed], ["var(--c-spend)", b.spent], ["var(--c-free)", b.free]];
  let off = 0, arcs = "";
  for (const [col, v] of segs){
    const frac = over ? 1 : v / total;
    if (frac <= 0) continue;
    const len = Math.max(0, frac * C - (frac < 1 ? 3 : 0));
    arcs += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;
    off += frac * C;
  }
  const pct = over ? 0 : Math.round(b.free / total * 100);
  return `<div class="wheel-wrap">
    <svg viewBox="0 0 200 200" role="img" aria-label="Te quedan ${esc(fmtMoney(b.free))} de ${esc(fmtMoney(S.income))}">
      <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="22"/>${arcs}
    </svg>
    <div class="wheel-center"><span class="eyebrow">${over ? "Te pasaste" : "Te queda"}</span>
      <span class="big ${over ? "neg" : ""}">${fmtMoney(Math.abs(b.free))}</span>
      <span class="muted" style="font-size:.82rem">${over ? "por encima de tu " + FREQ[S.freq].unit : pct + "% de " + fmtMoney(S.income)}</span></div>
  </div>`;
}

/* ---------- estado de cuenta ---------- */
let stmtKey = null;
function statementPeriods(){
  const cur = snapshotCurrent();
  const list = (S.history || []).slice().reverse();
  return cur ? [cur, ...list.filter(h => h.key !== cur.key)] : list;
}
function buildStatement(sn){
  const rows = [];
  rows.push({date:sn.start, desc:`Salario ${FREQ[sn.freq] ? FREQ[sn.freq].per : ""}`, type:"Ingreso", credit:sn.income});
  if (sn.saving) rows.push({date:sn.start, desc:"Ahorro automático", type:"Ahorro", debit:sn.saving});
  sn.goals.forEach(g => rows.push({date:sn.start, desc:`Meta: ${g.name}`, type:"Meta", debit:g.amount}));
  sn.fixed.forEach(f => rows.push({date:sn.start, desc:f.name, type:"Gasto fijo", debit:f.amount}));
  (sn.expenses || []).slice()
    .sort((a, c) => a.date.localeCompare(c.date) || a.t - c.t)
    .forEach(e => rows.push({date:e.date, desc:e.desc || (CATS[e.cat] || CATS.otros)[0], type:(CATS[e.cat] || CATS.otros)[0], debit:e.amount}));
  let bal = 0;
  rows.forEach(r => { bal += (r.credit || 0) - (r.debit || 0); r.balance = bal; });
  const tot = k => rows.filter(r => r.type === k).reduce((s, r) => s + (r.debit || 0), 0);
  const expenses = rows.filter(r => !["Ingreso","Ahorro","Meta","Gasto fijo"].includes(r.type)).reduce((s, r) => s + r.debit, 0);
  return {rows, final:bal, saving:tot("Ahorro"), goals:tot("Meta"), fixed:tot("Gasto fijo"), expenses,
    debits:rows.reduce((s, r) => s + (r.debit || 0), 0)};
}
function vEstado(){
  const periods = statementPeriods();

  const sn = periodData(sel.key);
  if (!sn) return `<div class="stack-lg"><h2>Estado de cuenta</h2>${periodSelect(periods, sel.key, "stmtSel")}<div class="auth" style="min-height:200px;align-items:center"><div class="spinner"></div><p class="muted">Cargando periodo…</p></div></div>`;
  const st = buildStatement(sn);
  const isCurrent = !!sn.current;
  const cutDate = isCurrent ? new Date() : parseISO(sn.end);
  return `<div class="stack-lg">
    <div class="section-title"><h2>Estado de cuenta</h2>${isCurrent ? `<span class="period-chip">En curso</span>` : `<span class="tag">Cerrado</span>`}</div>
    ${periodSelect(periods, sn.key, "stmtSel")}
    ${sn.missing ? `<p class="err">No se encontraron los gastos guardados de este periodo.</p>` : ""}
    <div class="card stack-lg">
      <div class="stmt-head">
        <div class="who"><b>${esc(displayName())}</b><small>${esc(S.account.email)}</small></div>

      </div>
      <div class="stmt-sum">
        <div><span class="eyebrow">Ingresos</span><b class="cr" style="color:var(--accent)">${fmtMoney(sn.income)}</b></div>
        <div><span class="eyebrow">Débitos</span><b>${fmtMoney(st.debits)}</b></div>
        <div><span class="eyebrow">Ahorro + metas</span><b style="color:var(--c-save)">${fmtMoney(st.saving + st.goals)}</b></div>
        <div><span class="eyebrow">${isCurrent ? "Saldo disponible" : "Saldo final"}</span><b style="color:${st.final < 0 ? "var(--danger)" : "var(--accent)"}">${fmtMoney(st.final)}</b></div>
      </div>
      <div class="ledger-wrap"><table class="ledger">
        <thead><tr><th>Fecha</th><th>Detalle</th><th class="n">Monto</th><th class="n">Saldo</th></tr></thead>
        <tbody>${st.rows.map(r => `<tr><td>${fmtD(parseISO(r.date))}</td><td>${esc(r.desc)}<br><small class="muted">${esc(r.type)}</small></td>
          <td class="n ${r.credit ? "cr" : "db"}">${r.credit ? "+" + fmtMoney(r.credit) : "−" + fmtMoney(r.debit)}</td><td class="n">${fmtMoney(r.balance)}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td colspan="3">${isCurrent ? "Saldo al corte" : "Saldo final"}</td><td class="n">${fmtMoney(st.final)}</td></tr></tfoot>
      </table></div>
      <div class="stack" style="gap:8px">
        <p class="eyebrow">Resumen de débitos</p>
        ${[["Ahorro", st.saving, "var(--c-save)"], ["Metas", st.goals, "var(--c-goal)"], ["Gastos fijos", st.fixed, "var(--c-fixed)"], ["Gastos variables", st.expenses, "var(--c-spend)"]].map(([n, v, c]) =>
          `<div class="row between" style="font-size:.9rem"><span class="row" style="gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:${c};display:inline-block"></i>${n}</span><b>${fmtMoney(v)}</b></div>`).join("")}

function statementText(sn, st){
  const lines = [`Estado de cuenta · ${sn.label}`, `${displayName()} (${S.account.email})`, `Del ${sn.start} al ${sn.end}`, ""];
  st.rows.forEach(r => lines.push(`${r.date}  ${r.desc}  ${r.credit ? "+" + fmtMoney(r.credit) : "-" + fmtMoney(r.debit)}  saldo ${fmtMoney(r.balance)}`));
  lines.push("", `Saldo final: ${fmtMoney(st.final)}`);
  return lines.join("\n");
}
function periodSelect(periods, selKey, id){
  if (periods.length < 2) return "";
  return `<label>Periodo<select id="${id}">${periods.map((p, i) => `<option value="${p.key}" ${p.key === selKey ? "selected" : ""}>${esc(p.label)}${i === 0 && p.key === (S.applied || {}).key ? " (actual)" : ""}</option>`).join("")}</select></label>`;
}
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); }); }
async function getJsPDF(){
  if (!window.jspdf) await loadScript("vendor/jspdf.umd.min.js");
  if (!window.jspdf.jsPDF.API.autoTable) await loadScript("vendor/jspdf.plugin.autotable.min.js");
  return window.jspdf.jsPDF;
}
const pdfTxt = t => String(t ?? "").replace(/[^\x20-\xFF]/g, "");
function pdfMoney(n, cur){
  const d = cur === "CRC" ? 0 : 2;
  return (n < 0 ? "-" : "") + cur + " " + Math.abs(n).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
}
async function statementPdf(sn, st){
  const jsPDF = await getJsPDF();
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const cur = sn.currency || S.currency, M = n => pdfMoney(n, cur);
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const ink = [16,35,31], mut = [90,109,104], jade = [14,107,91];
  doc.setFillColor(...jade); doc.rect(0, 0, W, 72, "F");
  doc.setTextColor(255); doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.text("Mi Quincena", 40, 44);
  doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.text("Estado de cuenta", W - 40, 44, {align:"right"});
  doc.setTextColor(...ink); doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text(pdfTxt(displayName()), 40, 104);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...mut); doc.text(pdfTxt(S.account.email), 40, 120);
  doc.text(pdfTxt(`Periodo: ${sn.label}`), W - 40, 104, {align:"right"});
  doc.text(`Del ${sn.start} al ${sn.end}`, W - 40, 120, {align:"right"});
  doc.text(`Fecha de corte: ${iso(sn.current ? new Date() : parseISO(sn.end))}`, W - 40, 136, {align:"right"});
  const boxes = [["Ingresos", sn.income], ["Débitos", st.debits], ["Ahorro + metas", st.saving + st.goals], [sn.current ? "Saldo al corte" : "Saldo final", st.final]];
  const bw = (W - 80 - 30) / 4;
  boxes.forEach(([l, v], i) => {
    const x = 40 + i * (bw + 10);
    doc.setFillColor(237,242,240); doc.roundedRect(x, 154, bw, 54, 6, 6, "F");
    doc.setFontSize(8); doc.setTextColor(...mut); doc.text(l.toUpperCase(), x + 10, 172);
    doc.setFontSize(12); doc.setFont("helvetica", "bold"); doc.setTextColor(...(i === 3 && v < 0 ? [194,58,43] : ink)); doc.text(M(v), x + 10, 194);
    doc.setFont("helvetica", "normal");
  });
  doc.autoTable({
    startY: 228, margin:{left:40, right:40},
    head: [["Fecha", "Detalle", "Tipo", "Monto", "Saldo"]],
    body: st.rows.map(r => [r.date, pdfTxt(r.desc), pdfTxt(r.type), r.credit ? "+" + M(r.credit) : "-" + M(r.debit), M(r.balance)]),
    foot: [[{content: sn.current ? "Saldo al corte" : "Saldo final", colSpan: 4}, M(st.final)]],
    styles: {font:"helvetica", fontSize:9, cellPadding:6, textColor:ink},
    headStyles: {fillColor:ink, textColor:255, fontStyle:"bold"},
    footStyles: {fillColor:[214,234,229], textColor:jade, fontStyle:"bold"},
    alternateRowStyles: {fillColor:[245,248,247]},
    columnStyles: {0:{cellWidth:70}, 3:{halign:"right"}, 4:{halign:"right"}},
    didParseCell: d => {
      if (d.column.index >= 3 || (d.section === "foot" && d.column.index === 4)) d.cell.styles.halign = "right";
      if (d.section === "foot" && d.column.index === 0) d.cell.styles.halign = "left";
      if (d.section === "body" && d.column.index === 3 && String(d.cell.raw).startsWith("+")) d.cell.styles.textColor = jade;
    }
  });
  let y = doc.lastAutoTable.finalY + 28;
  if (y > H - 130){ doc.addPage(); y = 60; }
  doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...ink); doc.text("Resumen de débitos", 40, y);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  [["Ahorro", st.saving], ["Metas", st.goals], ["Gastos fijos", st.fixed], ["Gastos variables", st.expenses]].forEach(([n, v], i) => {
    doc.text(n, 40, y + 20 + i * 16); doc.text(M(v), 300, y + 20 + i * 16, {align:"right"});
  });
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++){
    doc.setPage(i); doc.setFontSize(8); doc.setTextColor(150);
    doc.text(`Generado el ${iso(new Date())}  ·  Página ${i} de ${pages}`, W / 2, H - 24, {align:"center"});
  }
  return doc.output("arraybuffer");
}

/* ---------- eventos ---------- */
function bindView(b){
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el[ev] = fn; };
  on("#goAdd", "onclick", () => { view = "gastos"; render(); setTimeout(() => $("#eDesc")?.focus(), 30); });
  on("#seeAll", "onclick", () => { view = "gastos"; render(); });

  on("#expForm", "onsubmit", ev => {
    ev.preventDefault();
    const amount = num($("#eAmt").value);
    if (!amount) return $("#expErr").textContent = "Escribe un monto mayor a cero.";
    const date = $("#eDate").value || iso(new Date());
    S.expenses.push({id:uid(), desc:$("#eDesc").value.trim(), amount, cat:$("#eCat").value, date, t:Date.now()});
    save(); render(); toast(`Gasto de ${fmtMoney(amount)} anotado`);
  });
  document.querySelectorAll("[data-del-exp]").forEach(x => x.onclick = () => {
    S.expenses = S.expenses.filter(e => e.id !== x.dataset.delExp); editExp = null; save(); render(); toast("Gasto borrado");
  });
  document.querySelectorAll("[data-edit-exp]").forEach(x => x.onclick = () => { editExp = x.dataset.editExp; editFix = null; render(); });
  document.querySelectorAll("[data-edit-fix]").forEach(x => x.onclick = () => { editFix = x.dataset.editFix; editExp = null; render(); });
  document.querySelectorAll("[data-cancel-edit]").forEach(x => x.onclick = () => { editExp = editFix = null; render(); });
  document.querySelectorAll("[data-save-exp]").forEach(f => f.onsubmit = ev => {
    ev.preventDefault();
    const e = S.expenses.find(x => x.id === f.dataset.saveExp); if (!e) return;
    const amount = num(f.elements.amount.value); if (!amount) return toast("El monto debe ser mayor a cero");
    e.desc = f.elements.desc.value.trim(); e.amount = amount; e.date = f.elements.date.value || e.date; e.cat = f.elements.cat.value;
    editExp = null; save(); render(); toast("Gasto actualizado");
  });
  document.querySelectorAll("[data-save-fix]").forEach(f => f.onsubmit = ev => {
    ev.preventDefault();
    const x = S.fixed.find(y => y.id === f.dataset.saveFix); if (!x) return;
    const amount = num(f.elements.amount.value), name = f.elements.name.value.trim();
    if (!amount || !name) return toast("Pon un nombre y un monto mayor a cero");
    x.name = name; x.amount = amount; x.slot = f.elements.slot.value;
    editFix = null; save(); render(); toast("Gasto fijo actualizado");
  });

  on("#stmtSel", "onchange", e => { stmtKey = e.target.value; render(); });
  const curStmt = () => { const ps = statementPeriods(); const sel = ps.find(p => p.key === stmtKey) || ps[0]; const sn = periodData(sel.key); return [sn, sn && buildStatement(sn)]; };
  on("#stmtCopy", "onclick", () => {
    const [sn, st] = curStmt(), text = statementText(sn, st);
    try { navigator.clipboard.writeText(text).then(() => toast("Resumen copiado"), () => toast("No se pudo copiar en este dispositivo")); }
    catch(e){ toast("No se pudo copiar en este dispositivo"); }
  });
  on("#stmtPdf", "onclick", async () => {
    if (!downloadsApi) return;
    const [sn, st] = curStmt(); if (!sn) return;
    const btn = $("#stmtPdf"); btn.disabled = true; btn.textContent = "Generando PDF…";
    let data;
    try { data = await statementPdf(sn, st); }
    catch(e){ toast("No se pudo generar el PDF. Revisa tu conexión."); btn.disabled = false; btn.textContent = "Descargar PDF"; return; }
    try { await downloadsApi.save({filename:`estado-de-cuenta-${sn.key}.pdf`, data}); toast("Estado de cuenta descargado"); }
    catch(e){ if (e && e.code !== "declined") toast("No se pudo descargar el archivo"); }
    btn.disabled = false; btn.textContent = "Descargar PDF";
  });
  on("#gastSel", "onchange", e => { gastosKey = e.target.value; editExp = null; render(); });
  on("#pastStmt", "onclick", () => { stmtKey = gastosKey; view = "estado"; render(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-open-stmt]").forEach(x => x.onclick = () => { stmtKey = x.dataset.openStmt; view = "estado"; render(); window.scrollTo(0, 0); });

  document.querySelectorAll("[data-theme-set]").forEach(x => x.onclick = () => { S.theme = x.dataset.themeSet; save(); render(); });
  on("#profForm", "onsubmit", ev => {
    ev.preventDefault();
    const email = $("#pEmail").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return $("#profErr").textContent = "Escribe un correo válido.";
    S.name = $("#pName").value.trim(); S.account.email = email; save(); render(); toast("Perfil guardado");
  });
  on("#pwForm", "onsubmit", async ev => {
    ev.preventDefault();
    const err = $("#pwErr"), oldPw = $("#pwOld").value, nw = $("#pwNew").value;
    if ((await hashPw(oldPw, S.account.salt)) !== S.account.hash) return err.textContent = "La contraseña actual no es correcta.";
    if (nw.length < 6) return err.textContent = "La nueva contraseña necesita al menos 6 caracteres.";
    if (nw !== $("#pwNew2").value) return err.textContent = "Las contraseñas nuevas no coinciden.";
    const salt = uid(); S.account.salt = salt; S.account.hash = await hashPw(nw, salt);
    save(); render(); toast("Contraseña actualizada");
  });

  on("#fixForm", "onsubmit", ev => {
    ev.preventDefault();
    const name = $("#fName").value.trim(), amount = num($("#fAmt").value);
    if (!name || !amount) return $("#fixErr").textContent = "Pon un nombre y un monto mayor a cero.";
    S.fixed.push({id:uid(), name, amount, slot:$("#fSlot").value}); save(); render(); toast(`${name} agregado`);
  });
  document.querySelectorAll("[data-del-fix]").forEach(x => x.onclick = () => {
    S.fixed = S.fixed.filter(f => f.id !== x.dataset.delFix); editFix = null; save(); render(); toast("Gasto fijo borrado");
  });

  on("#saveForm", "onsubmit", ev => {
    ev.preventDefault();
    const v = num($("#sAmt").value);
    const prev = S.applied ? S.applied.saving : 0;
    S.savingTotal = Math.max(0, S.savingTotal + v - prev);
    if (S.applied) S.applied.saving = v;
    S.savingAmount = v; save(); render(); toast("Ahorro actualizado");
  });
  on("#goalForm", "onsubmit", ev => {
    ev.preventDefault();
    const name = $("#gName").value.trim(), target = num($("#gTarget").value), per = num($("#gPer").value);
    if (!name || !target || !per) return $("#goalErr").textContent = "Completa nombre, costo y aporte (mayores a cero).";
    const g = {id:uid(), name, target, per, saved:0};
    const amt = Math.min(per, target); g.saved = amt;
    S.goals.push(g); if (S.applied) S.applied.goals[g.id] = amt;
    save(); render(); toast(`Meta “${name}” creada`);
  });
  document.querySelectorAll("[data-goal-per]").forEach(f => f.onsubmit = ev => {
    ev.preventDefault();
    const g = S.goals.find(x => x.id === f.dataset.goalPer); if (!g) return;
    const per = num(f.querySelector("input").value);
    const prev = (S.applied && S.applied.goals[g.id]) || 0;
    const base = g.saved - prev, amt = Math.max(0, Math.min(per, g.target - base));
    g.saved = base + amt; g.per = per; if (S.applied) S.applied.goals[g.id] = amt;
    save(); render(); toast("Aporte actualizado");
  });
  document.querySelectorAll("[data-goal-ask]").forEach(x => x.onclick = () => { confirmGoal = x.dataset.goalAsk; render(); });
  document.querySelectorAll("[data-goal-cancel]").forEach(x => x.onclick = () => { confirmGoal = null; render(); });
  document.querySelectorAll("[data-goal-del]").forEach(x => x.onclick = () => {
    const id = x.dataset.goalDel; S.goals = S.goals.filter(g => g.id !== id);
    if (S.applied) delete S.applied.goals[id]; confirmGoal = null; save(); render(); toast("Meta borrada");
  });

  document.querySelectorAll("[data-freq]").forEach(x => x.onclick = () => {
    const nf = x.dataset.freq; if (nf === S.freq) return;
    undoApplied(); S.freq = nf;
    const valid = SLOTS[nf].map(s => s[0]);
    S.fixed.forEach(f => { if (!valid.includes(f.slot)) f.slot = "all"; });
    catchUp(); save(); render(); toast(`Ahora cobras ${FREQ[nf].label.toLowerCase()}. Revisa tu salario.`);
  });
  if ($("#aCur")) $("#aCur").value = S.currency;
  on("#incEdit", "onsubmit", ev => {
    ev.preventDefault();
    const v = num($("#aInc").value); if (!v) return toast("El salario debe ser mayor a cero");
    S.income = v; S.currency = $("#aCur").value; setCurrency(S.currency); save(); render(); toast("Salario guardado");
  });
  on("#logout", "onclick", () => { unlocked = false; try{ sessionStorage.removeItem("mq-unlocked"); }catch(e){} render(); });
  on("#reset", "onclick", () => { confirmReset = true; render(); });
  on("#resetNo", "onclick", () => { confirmReset = false; render(); });
  on("#resetYes", "onclick", () => { S = blankState(); unlocked = false; confirmReset = false; view = "inicio";
    try{ sessionStorage.removeItem("mq-unlocked"); }catch(e){} persist && persist.save(S); render(); });
}

/* ---------- arranque ---------- */
const LS_KEY = "mi-quincena-v1";
const archLocalKey = k => "mq-arch-" + k;
function localPersist(){
  return {
    save(state){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} },
    async saveArchive(k, data){ localStorage.setItem(archLocalKey(k), JSON.stringify(data)); },
    async loadArchive(k){ try{ const r = localStorage.getItem(archLocalKey(k)); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
  };
}
function readLocal(){ try{ const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }

async function init(){
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === "function"){
    const timeout = new Promise(r => setTimeout(() => r(null), 8000));
    try { [db, user] = await Promise.all([Promise.race([claude.use("db"), timeout]), Promise.race([claude.use("user"), timeout])]); } catch(e){}
  }
  if (window.claude && typeof window.claude.use === "function"){
    claude.use("downloads").then(d => { downloadsApi = d; if (d && view === "estado") render(); }).catch(() => {});
  } else {
    downloadsApi = {async save({filename, data}){
      const url = URL.createObjectURL(new Blob([data], {type:"application/pdf"}));
      const a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }};
  }
  let id = null;
  if (db && user){ try{ id = await user.id(); }catch(e){} }
  if (db && id){
    const ref = db.doc(`data/users/${id}/app`);
    let busy = false, again = null;
    persist = {async save(state){
      try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
      if (busy){ again = state; return; }
      busy = true;
      try{ await ref.set(JSON.parse(JSON.stringify(state))); }
      catch(e){ toast(e && e.code === "quota_exceeded" ? "Ya no hay espacio. Borra gastos viejos." : "No se pudo guardar. Revisa tu conexión."); }
      busy = false;
      if (again){ const s = again; again = null; persist.save(s); }
    },
    async saveArchive(k, data){
      try{ localStorage.setItem(archLocalKey(k), JSON.stringify(data)); }catch(e){}
      await db.doc(`data/users/${id}/arch-${k}`).set(JSON.parse(JSON.stringify(data)));
    },
    async loadArchive(k){
      try{ const snap = await db.doc(`data/users/${id}/arch-${k}`).get(); if (snap.exists) return JSON.parse(JSON.stringify(snap.data())); }catch(e){}
      try{ const r = localStorage.getItem(archLocalKey(k)); return r ? JSON.parse(r) : null; }catch(e){ return null; }
    }};
    try{
      const snap = await ref.get();
      S = snap.exists ? Object.assign(blankState(), JSON.parse(JSON.stringify(snap.data()))) : (readLocal() ? Object.assign(blankState(), readLocal()) : blankState());
    }catch(e){ S = Object.assign(blankState(), readLocal() || {}); }
  } else {
    persist = localPersist();
    S = Object.assign(blankState(), readLocal() || {});
  }
  setCurrency(S.currency || "CRC");
  try{ unlocked = !!S.account && sessionStorage.getItem("mq-unlocked") === "1"; }catch(e){}
  if (S.income && catchUp()) save();
  render();
  flushArchives();
  // si la app queda abierta y cambia de periodo
  setInterval(() => { if (S && S.income && catchUp()){ save(); render(); flushArchives(); } }, 60000);
}
document.addEventListener("visibilitychange", () => { if (document.hidden && S && persist){ clearTimeout(saveTimer); persist.save(S); } });
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
init();
})();
</script>
